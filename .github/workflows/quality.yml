name: Quality gate

on:
  push:
    branches:
      - main
      - "upgrade/**"
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate catalogs, claims, translations, and output
        run: npm run check

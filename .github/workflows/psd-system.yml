name: PSD internal system

on:
  push:
    branches:
      - main
    paths:
      - "apps/psd-system/**"
      - "docs/system/**"
      - ".github/workflows/psd-system.yml"
  pull_request:
    paths:
      - "apps/psd-system/**"
      - "docs/system/**"
      - ".github/workflows/psd-system.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: psd
          POSTGRES_PASSWORD: psd
          POSTGRES_DB: psd_system
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psd -d psd_system"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/psd-system
    env:
      PSD_DATA_MODE: demo
      AUTH_MODE: demo
      ALLOW_DEMO_AUTH: "true"
      AUTH_SECRET: build-only-secret-build-only-secret
      ALLOW_DEMO_INGEST: "true"
      PSD_DEMO_INGEST_TOKEN: demo-only-change-me
      DATABASE_URL: postgresql://psd:psd@localhost:5432/psd_system?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies and generate candidate lockfile
        run: npm install

      - name: Export candidate lockfile for repository review
        uses: actions/upload-artifact@v4
        with:
          name: psd-system-package-lock
          path: apps/psd-system/package-lock.json
          retention-days: 7

      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck, tests, and production build
        run: npm run check

      - name: Verify PostgreSQL schema, seed, and repository read model
        run: npm run db:verify:ci

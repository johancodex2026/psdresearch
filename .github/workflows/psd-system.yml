name: PSD internal system

on:
  push:
    branches:
      - "feature/internal-psd-system-*"
  pull_request:
    paths:
      - "apps/psd-system/**"
      - "docs/system/**"
      - ".github/workflows/psd-system.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/psd-system
    env:
      PSD_DATA_MODE: demo
      AUTH_MODE: demo
      ALLOW_DEMO_AUTH: "true"
      AUTH_SECRET: build-only-secret-build-only-secret
      ALLOW_DEMO_INGEST: "true"
      PSD_DEMO_INGEST_TOKEN: demo-only-change-me
      DATABASE_URL: postgresql://psd:psd@localhost:5432/psd_system?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Report production dependency audit
        run: npm audit --omit=dev --json || true

      - name: Typecheck, tests, and production build
        run: npm run check

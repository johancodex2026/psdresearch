services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: psd
      POSTGRES_PASSWORD: psd
      POSTGRES_DB: psd_system
    ports:
      - "5432:5432"
    volumes:
      - psd-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psd -d psd_system"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  psd-postgres:
